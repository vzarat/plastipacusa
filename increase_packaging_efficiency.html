<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Increase Packaging Efficiency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #e8eef5;
        font-family: Inter, sans-serif;
      }

      .slide {
        position: relative;
        width: min(1400px, 100%);
        height: 560px;
        margin: 0 auto;
        overflow: hidden;
        background: #07111f url("https://ahvmjptomjjnqjylofpa.supabase.co/storage/v1/object/public/Products/SLIDES/SLIDE_2.jpg")
          center / cover no-repeat;
      }

      .slide::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.38) 46%,
          rgba(0, 0, 0, 0.05) 72%
        );
      }

      .copy {
        position: relative;
        z-index: 2;
        display: flex;
        height: 100%;
        max-width: 68%;
        flex-direction: column;
        justify-content: center;
        padding-left: 110px;
      }

      h1 {
        margin: 0;
        color: #fff;
        font-family: Teko, "Arial Narrow", Impact, sans-serif;
        font-size: 100px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 0.85;
        text-transform: uppercase;
      }

      .cta {
        display: inline-flex;
        width: fit-content;
        margin-top: 28px;
        align-items: center;
        border-radius: 12px;
        background: linear-gradient(to right, #06b6d4, #2563eb);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.04em;
        padding: 14px 26px;
        text-decoration: none;
        text-transform: uppercase;
      }

      .cta:hover {
        background: linear-gradient(to right, #22d3ee, #3b82f6);
      }

      .machine {
        position: absolute;
        z-index: 1;
        right: 12px;
        bottom: 0;
        height: 96%;
        width: auto;
        max-width: 48%;
        object-fit: contain;
        object-position: right bottom;
        pointer-events: none;
      }

      @media (max-width: 800px) {
        .slide {
          height: 640px;
        }

        .copy {
          max-width: 100%;
          padding-left: 28px;
          padding-right: 28px;
          justify-content: flex-start;
          padding-top: 48px;
        }

        h1 {
          font-size: 64px;
        }

        .machine {
          right: 0;
          height: 46%;
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <section class="slide" aria-label="Increase packaging efficiency">
      <img
        class="machine"
        src="https://ahvmjptomjjnqjylofpa.supabase.co/storage/v1/object/public/Products/SLIDES/ROBOPACK.png"
        alt="Robopack stretch wrapping machine"
      />
      <div class="copy">
        <h1>
          Increase<br />
          Packaging<br />
          Efficiency
        </h1>
        <a class="cta" href="/#inquiry-form">Contact Us Today!</a>
      </div>
    </section>
  </body>
</html>

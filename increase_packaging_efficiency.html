<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Increase Packaging Efficiency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #e8eef5;
        font-family: Inter, sans-serif;
      }

      .slide {
        position: relative;
        width: min(1400px, 100%);
        height: 560px;
        margin: 0 auto;
        overflow: hidden;
        background: #07111f url("https://ahvmjptomjjnqjylofpa.supabase.co/storage/v1/object/public/Products/SLIDES/SLIDE_2.jpg")
          center / cover no-repeat;
      }

      .slide::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.38) 46%,
          rgba(0, 0, 0, 0.05) 72%
        );
      }

      .copy {
        position: relative;
        z-index: 2;
        display: flex;
        height: 100%;
        max-width: 68%;
        flex-direction: column;
        justify-content: center;
        padding-left: 110px;
      }

      h1 {
        margin: 0;
        font-family: Teko, "Arial Narrow", Impact, sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }

      h1 .line-one {
        display: block;
        color: #fff;
        font-size: 68px;
        line-height: 0.85;
      }

      h1 .line-two {
        display: block;
        background: linear-gradient(to right, #67e8f9, #3b82f6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 88px;
        line-height: 0.85;
      }

      .lede {
        max-width: 440px;
        margin: 16px 0 0;
        color: #e5e7eb;
        font-family: Inter, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.35;
      }

      .lede strong {
        color: #fff;
        font-weight: 700;
      }

      .cta {
        display: inline-flex;
        width: fit-content;
        margin-top: 20px;
        align-items: center;
        border: 1px solid rgba(186, 230, 253, 0.4);
        border-radius: 2px;
        background: linear-gradient(to right, #06b6d4, #2563eb);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 10px 20px;
        text-decoration: none;
        text-transform: uppercase;
      }

      .cta:hover {
        background: linear-gradient(to right, #22d3ee, #3b82f6);
      }

      .machine {
        position: absolute;
        z-index: 1;
        right: 180px;
        bottom: 25px;
        height: 90%;
        width: auto;
        max-width: 42%;
        object-fit: contain;
        object-position: center bottom;
        pointer-events: none;
      }

      @media (max-width: 800px) {
        .slide {
          height: 640px;
        }

        .copy {
          max-width: 100%;
          padding-left: 28px;
          padding-right: 28px;
          justify-content: flex-start;
          padding-top: 48px;
        }

        h1 .line-one {
          font-size: 42px;
        }

        h1 .line-two {
          font-size: 54px;
        }

        .machine {
          right: 50%;
          bottom: 16px;
          height: 34%;
          max-width: 72%;
          transform: translateX(50%);
        }
      }
    </style>
  </head>
  <body>
    <section class="slide" aria-label="Increase packaging efficiency">
      <img
        class="machine"
        src="https://ahvmjptomjjnqjylofpa.supabase.co/storage/v1/object/public/Products/SLIDES/ROBOPACK.png"
        alt="Robopack stretch wrapping machine"
      />
      <div class="copy">
        <h1>
          <span class="line-one">Increase Packaging</span>
          <span class="line-two">Efficiency</span>
        </h1>
        <p class="lede">
          At <strong>Plastipac USA</strong>, we're all about smarter packaging solutions to help your
          business work better!
        </p>
        <a class="cta" href="/#inquiry-form">Contact Us Today!</a>
      </div>
    </section>
  </body>
</html>
